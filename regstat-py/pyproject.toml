[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "regstat"
version = "0.1.0"
description = "An exact test for a change in covariance (dependence) structure (shared C back-end, also bound from R)"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Mathematics",
]
license = "GPL-3.0-or-later"
authors = [{name="M. Theodor Loots", email="theo.loots@gmail.com"}]
readme = "README.md"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
regstat = ["*.c", "*.h"]

[project.urls]
Homepage = "https://github.com/mtloots/regstat"
