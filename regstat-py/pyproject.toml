[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "regstat"
version = "0.1.0"
description = "An exact test for a change in covariance (dependence) structure (shared C back-end, also bound from R)"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [{name="M. Theodor Loots", email="theo.loots@gmail.com"}]
readme = "README.md"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
regstat = ["*.c", "*.h"]
